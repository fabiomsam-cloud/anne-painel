# Deploy do painel via GitHub Actions (build_type=workflow).
# Adotado em 06/08/2026: o builder clássico do Pages entrou em estado zumbi
# ("Page build failed" sem motivo, 3x seguidas) e não pode ser recriado.
# Fluxo: push no main → CI builda o vite → publica. O branch gh-pages ficou obsoleto.
name: Deploy painel (GitHub Pages)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
